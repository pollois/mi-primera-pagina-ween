<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Programa Final - Ejercicios JavaScript</title>
</head>
<body>
    <header class="container-fluid p-5 bg-primary text-white text-center">
        <h1>Programa Final de Actividades</h1>
    </header>

    <section class="container my-5">
        
        <div class="card p-4 mb-4 shadow-sm">
            <h3>1. Temperaturas de los 7 días</h3>
            <div class="mt-3">
                <button class="btn btn-warning" onclick="cargar()">
                    Capturar temperaturas
                </button>
                <button class="btn btn-success" onclick="mostrar()">
                    Mostrar resultados
                </button>
            </div>
            <hr>
            <p id="temperaturas"></p>
            <p id="suma"></p>
            <p id="promedio"></p>
            <p id="minima"></p>
            <p id="maxima"></p>
        </div>

        <div class="card p-4 mb-4 shadow-sm">
            <h3>2. Ejercicio 3: Patrón del Número 8</h3>
            <div class="mt-3">
                <button class="btn btn-info text-white" onclick="construirPatronOcho()">
                    Mostrar Patrón 8
                </button>
            </div>
            <div class="mt-3" id="impBloques"></div>
        </div>

        <div class="card p-4 mb-4 shadow-sm">
            <h3>3. Gestión de Alumnos y Arreglos</h3>
            <div class="mt-3">
                <button class="btn btn-dark" onclick="gestionarAlumnos()">
                    Iniciar Gestión de Alumnos
                </button>
            </div>
            <hr>
            <div id="resultadoAlumnos"></div>
        </div>

    </section>

    <script src="js/ola.js"></script>

    <script>
        function construirPatronOcho() {
            let contenido = "<div style='font-family:monospace; font-size:20px; line-height:1.2; white-space:pre;'>";
            
            let matrizOcho = [
                " OOOOO ",
                " O   O ",
                " O   O ",
                " OOOOO ",
                " O   O ",
                " O   O ",
                " OOOOO "
            ];

            for (let indice = 0; indice < matrizOcho.length; indice++) {
                contenido += matrizOcho[indice] + "<br>";
            }
            
            contenido += "</div>";
            document.getElementById("impBloques").innerHTML = contenido;
        }

        let diasSemana = new Array(7);
        diasSemana[0] = "lunes";
        diasSemana[1] = "martes";
        diasSemana[2] = "miercoles";
        diasSemana[3] = "jueves";
        diasSemana[4] = "viernes";
        diasSemana[5] = "sabado";
        diasSemana[6] = "domingo";

        let agendaMatriz;

        function gestionarAlumnos() {
            let alumnos = new Array(10);
            var cadena = '';

            for (let i = 0; i < 10; i++) {
                alumnos[i] = prompt("Captura el nombre del alumno " + (i + 1) + " de 10:");
            }

            cadena += '<div class="fw-bold">Lista original de alumnos:</div>';
            for (let i = 0; i < 10; i++) {
                cadena += '<div>Posición ' + i + ': ' + alumnos[i] + '</div>';
            }

            cadena += '<hr>';

            let inicioEliminar = parseInt(prompt("¿De qué posición deseas empezar a eliminar? (0 al 9):"));
            let cantidadEliminar = parseInt(prompt("¿Cuántas posiciones deseas eliminar a partir de ahí?"));

            alumnos.splice(inicioEliminar, cantidadEliminar);

            cadena += '<div class="fw-bold">Lista después de eliminar el rango:</div>';
            for (let i = 0; i < alumnos.length; i++) {
                cadena += '<div>Posición ' + i + ': ' + alumnos[i] + '</div>';
            }

            cadena += '<hr>';

            let nombreBuscar = prompt("Ingresa un nombre para buscar y vaciar su posición:");
            let encontrada = false;

            for (let j = 0; j < alumnos.length; j++) {
                if (alumnos[j] === nombreBuscar) {
                    alumnos[j] = "Vacío";
                    encontrada = true;
                }
            }

            if (encontrada) {
                cadena += '<div class="text-success fw-bold">Se encontró y vació la posición del alumno: ' + nombreBuscar + '</div>';
            } else {
                cadena += '<div class="text-danger fw-bold">No se encontró el alumno ' + nombreBuscar + ' en la lista actual.</div>';
            }

            cadena += '<br><div class="fw-bold">Lista final de alumnos:</div>';
            for (let i = 0; i < alumnos.length; i++) {
                cadena += '<div>Posición ' + i + ': ' + alumnos[i] + '</div>';
            }

            document.getElementById("resultadoAlumnos").innerHTML = cadena;
        }
    </script>
</body>
</html>
